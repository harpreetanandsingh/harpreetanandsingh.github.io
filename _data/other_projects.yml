- title: Yield Curve PCA & Rate Regimes
  summary: Three PCA factors explain 99.9% of Treasury curve variance (level alone 92.1%); K-means finds four rate regimes, and no model beats a no-change forecast for next-month 10Y moves.
- title: Corporate Loan Pricing with Machine Learning
  summary: Predicts syndicated loan spreads; OLS reaches test RMSE 54 bps and out-of-sample R² 0.48, with contract terms carrying most of the signal.
- title: Semantic Peer Firms from 10-K Text
  summary: Peers built from 10-K business descriptions with TF-IDF and BGE embeddings co-move more with the focal firm than industry-and-size peers (correlation 0.151 vs 0.120).
- title: Stock Market Simulator
  summary: Django REST backend with a user-to-user ask–bid trading system, Celery, Django Channels and Redis; ran live for 400+ registered users.
- title: ERPLAG Compiler
  summary: Lexer, parser and parse-tree generation with error reporting and recovery for the ERPLAG language.
- title: Hilbert R-Tree
  summary: Hilbert-curve-ordered R-Tree for faster spatial indexing and queries, following Kamel and Faloutsos.
  url: https://github.com/harpreetanandsingh/Hilbert-R-Tree-Implementation
