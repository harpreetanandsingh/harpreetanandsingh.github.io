name: Harpreet Singh Anand
tagline: Quantitative finance × machine learning
bio: >-
  I'm an MS student in Quantitative and Computational Finance at Georgia Tech,
  drawn to how markets behave when things go wrong: fat tails, regime shifts
  and the risks that standard models understate. Much of my work asks when
  machine learning genuinely beats classical estimators out of sample, and how
  to get reliable, verifiable answers from long financial text with LLMs, which
  led to an ACL 2026 benchmark on SEC credit agreements. Next, I want to bring
  causal inference and uncertainty quantification into quant finance, so that
  models say not just what they predict but why, and how confident they should
  be. Before Georgia Tech, I was a Graduate Data Scientist at Commonwealth Bank
  of Australia.
